# Test database only — intentionally EPHEMERAL (no volume): integration tests
# migrate + insert throwaway data and want a clean, deterministic state each run.
# For a persistent local *dev* DB, add a volume but PIN PGDATA — pg18's default
# data dir is version-coupled (/var/lib/postgresql/18/docker), not the old
# /var/lib/postgresql/data, so mounting the legacy path would persist nothing:
#   environment: { PGDATA: /var/lib/postgresql/data }
#   volumes: [ oarly_pgdata:/var/lib/postgresql/data ]
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oarly_test
    ports:
      - '5433:5432'

  postgres-dev:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oarly_dev
      PGDATA: /var/lib/postgresql/data
    ports:
      - '5434:5432'
    volumes:
      - oarly_dev_pgdata:/var/lib/postgresql/data

  # Rate-limiter development/testing only, hence the profile: `docker compose up -d`
  # still starts just Postgres. @upstash/redis speaks Upstash's REST protocol, so a
  # vanilla redis container is not enough — srh is the REST shim in front of it.
  #   docker compose --profile redis up -d
  redis:
    image: redis:8-alpine
    profiles: [redis]

  redis-http:
    image: hiett/serverless-redis-http:latest
    profiles: [redis]
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8079:80'
    depends_on:
      - redis

volumes:
  oarly_dev_pgdata:
